<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" preserveAspectRatio="xMidYMid meet">

  <!-- ─── BACKGROUND ─────────────────────────────────────────── -->
  <rect width="880" height="200" rx="12" fill="#1a4ab5"/>

  <!-- ─── OUTER BORDER ──────────────────────────────────────── -->
  <rect x="4" y="4" width="872" height="192" rx="9"
        fill="none" stroke="#f5c518" stroke-width="3" opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════════
       LEFT FIGURE  (human silhouette — exact colours from logo)
       ═══════════════════════════════════════════════════════════ -->

  <!-- Purple ball — head -->
  <circle cx="78" cy="22" r="13" fill="#b044cc"/>

  <!-- Yellow crescent body (left side — D-shape curving left) -->
  <path d="M 65 42
           C 40 55, 28 78, 32 106
           C 35 122, 46 134, 60 136
           C 68 137, 74 132, 75 122
           C 77 108, 70 92, 66 76
           C 62 60, 64 48, 68 38
           C 70 35, 68 40, 65 42 Z"
        fill="#f5c518"/>

  <!-- Red right arm sweep (bold curved wing rightward) -->
  <path d="M 70 46
           C 84 36, 104 30, 120 38
           C 126 42, 124 50, 116 54
           C 104 60, 86 56, 76 50
           C 71 47, 69 46, 70 46 Z"
        fill="#e8231e"/>

  <!-- Green right leg (going down-right) -->
  <path d="M 74 122
           C 72 138, 70 152, 74 170
           C 76 178, 82 182, 88 180
           C 94 178, 94 170, 90 158
           C 86 144, 80 130, 76 122 Z"
        fill="#2db034"/>

  <!-- ═══════════════════════════════════════════════════════════
       MAIN TEXT  — PROTOUCH
       ═══════════════════════════════════════════════════════════ -->
  <text x="148" y="126"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-weight="900"
        font-size="100"
        fill="#ffffff"
        letter-spacing="3">PROTOUCH</text>

  <!-- Yellow horizontal rule below PROTOUCH -->
  <rect x="148" y="133" width="565" height="6" rx="3" fill="#f5c518"/>

  <!-- Subtitle -->
  <text x="152" y="175"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-style="italic"
        font-size="38"
        fill="#f5c518"
        letter-spacing="1">Physio - Slimming Clinic</text>

  <!-- ═══════════════════════════════════════════════════════════
       RIGHT CIRCLE  — spine / physio icon
       ═══════════════════════════════════════════════════════════ -->
  <!-- Rainbow outer ring -->
  <circle cx="822" cy="100" r="72" fill="none" stroke="#e8231e"  stroke-width="18"/>
  <circle cx="822" cy="100" r="72" fill="none" stroke="#f5c518"  stroke-width="6"
          stroke-dasharray="113 339" stroke-dashoffset="0" opacity="0.9"/>
  <circle cx="822" cy="100" r="72" fill="none" stroke="#2db034"  stroke-width="6"
          stroke-dasharray="113 339" stroke-dashoffset="113" opacity="0.9"/>
  <circle cx="822" cy="100" r="72" fill="none" stroke="#1a7fc1"  stroke-width="6"
          stroke-dasharray="113 339" stroke-dashoffset="226" opacity="0.9"/>

  <!-- Inner dark circle -->
  <circle cx="822" cy="100" r="56" fill="#0d2278"/>

  <!-- Spine column (vertical white line) -->
  <line x1="820" y1="44" x2="820" y2="154"
        stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Vertebrae discs — 9 horizontal ellipses -->
  <ellipse cx="820" cy="50"  rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="62"  rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="74"  rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="86"  rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="98"  rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="110" rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="122" rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="134" rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="820" cy="146" rx="12" ry="5.5" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Human figure (white outline — bent pain posture, right side of spine) -->
  <!-- Head -->
  <circle cx="843" cy="50" r="10" fill="none" stroke="white" stroke-width="3"/>
  <!-- Neck to upper back -->
  <path d="M 843 60 C 842 68, 838 74, 834 82"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Upper torso curving down -->
  <path d="M 834 82 C 838 92, 840 104, 836 116 C 832 126, 828 132, 826 140"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Upper arm raised back (pain gesture) -->
  <path d="M 838 80 C 848 72, 858 68, 858 58"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Forearm bent up toward head -->
  <path d="M 858 58 C 852 50, 844 48, 840 54"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Upper leg -->
  <path d="M 826 140 C 825 148, 825 154, 827 160"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Green healing hands at bottom of circle -->
  <path d="M 783 148 C 790 140, 800 138, 810 142 C 814 144, 816 148, 814 153"
        fill="none" stroke="#2db034" stroke-width="5" stroke-linecap="round"/>
  <path d="M 783 148 C 780 154, 780 161, 784 164"
        fill="none" stroke="#2db034" stroke-width="5" stroke-linecap="round"/>
  <path d="M 784 164 C 787 167, 792 167, 795 164"
        fill="none" stroke="#2db034" stroke-width="4" stroke-linecap="round"/>
</svg>
